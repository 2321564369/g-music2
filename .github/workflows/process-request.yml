name: Process song request
on:
  repository_dispatch:
    types: [process-request]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install python deps
        run: pip install yt-dlp supabase requests

      - name: Write cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: echo "$YT_COOKIES" > cookies.txt

      - name: Run downloader
        env:
          YOUTUBE_ID: ${{ github.event.client_payload.youtube_id }}
          QUERY: ${{ github.event.client_payload.query }}
          TITLE: ${{ github.event.client_payload.title }}
          ARTIST: ${{ github.event.client_payload.artist }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python process_request.py
