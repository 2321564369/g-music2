<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Music — Down</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at top, #1e1033 0%, #0a0612 60%, #050308 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }

  .stars, .stars2, .stars3 {
    position: absolute;
    inset: 0;
    background-repeat: repeat;
    z-index: 0;
  }
  .stars {
    background-image: radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 90px 80px, #fff, transparent),
      radial-gradient(1px 1px at 150px 140px, #fff, transparent),
      radial-gradient(1px 1px at 200px 60px, #fff, transparent);
    background-size: 220px 220px;
    opacity: 0.5;
    animation: drift 90s linear infinite;
  }
  .stars2 {
    background-image: radial-gradient(1.5px 1.5px at 60px 100px, #a78bfa, transparent),
      radial-gradient(1.5px 1.5px at 160px 40px, #a78bfa, transparent);
    background-size: 300px 300px;
    opacity: 0.4;
    animation: drift 140s linear infinite reverse;
  }
  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(-1000px); }
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 420px;
    padding: 48px 36px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(167, 139, 250, 0.25);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  .icon {
    font-size: 48px;
    margin-bottom: 18px;
    display: inline-block;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.94); }
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #c4b5fd, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p {
    font-size: 14.5px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.65);
    margin-bottom: 8px;
  }

  .sub {
    margin-top: 20px;
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>

<div class="card">
  <div class="icon">🌌</div>
  <h1>Galaxy Music is down until furthure notice</h1>
  <p>Due to lack of a server galaxy music is unable to function</p>
  <div class="sub">Check back soon. Or buy me a rabery pi</div>
</div>

</body>
</html>
